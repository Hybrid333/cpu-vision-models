[project]
name = "cpuvision"
version = "0.1.0"
description = "Depth maps, x4 upscaling and person masks on CPU with onnxruntime - weights from GitHub releases, no PyTorch or Hugging Face."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy", "pillow", "onnxruntime", "onnx"]

[project.scripts]
cpuvision = "cpuvision.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cpuvision"]
